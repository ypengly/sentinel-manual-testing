<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel Manual Testing Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F8FAFC;
    --surface-2:#EEF2FF;
    --surface-3:#FFFFFF;
    --border:#E2E8F0;
    --border-strong:#CBD5E1;
    --text:#0F172A;
    --text-muted:#5B6B85;
    --text-faint:#8494AC;
    --primary:#4338CA;
    --primary-strong:#3730A3;
    --primary-tint:#EEF2FF;
    --on-primary:#FFFFFF;
    --success:#0D9488;
    --success-tint:#ECFDF9;
    --warning:#B45309;
    --warning-tint:#FFF7ED;
    --danger:#DC2626;
    --danger-tint:#FEF2F2;
    --neutral-tint:#F1F5F9;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.10);
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --radius:14px;
    --radius-sm:9px;
    --font-ui:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0F1C;
      --surface:#111827;
      --surface-2:#1A2036;
      --surface-3:#151C2E;
      --border:#26304A;
      --border-strong:#334066;
      --text:#E7EBF7;
      --text-muted:#9AA6C3;
      --text-faint:#6B7793;
      --primary:#818CF8;
      --primary-strong:#A5B0FB;
      --primary-tint:#1B2044;
      --on-primary:#0A0F1C;
      --success:#2DD4BF;
      --success-tint:#0C2422;
      --warning:#FBBF24;
      --warning-tint:#2A2110;
      --danger:#F87171;
      --danger-tint:#2A1416;
      --neutral-tint:#1A2033;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0F1C;
    --surface:#111827;
    --surface-2:#1A2036;
    --surface-3:#151C2E;
    --border:#26304A;
    --border-strong:#334066;
    --text:#E7EBF7;
    --text-muted:#9AA6C3;
    --text-faint:#6B7793;
    --primary:#818CF8;
    --primary-strong:#A5B0FB;
    --primary-tint:#1B2044;
    --on-primary:#0A0F1C;
    --success:#2DD4BF;
    --success-tint:#0C2422;
    --warning:#FBBF24;
    --warning-tint:#2A2110;
    --danger:#F87171;
    --danger-tint:#2A1416;
    --neutral-tint:#1A2033;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--primary-tint);color:var(--primary-strong);}

  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:264px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0;left:0;bottom:0;
    z-index:40;
    transition:transform .2s ease;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:22px 20px 18px;
    border-bottom:1px solid var(--border);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--primary),#6D5AE6);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:18px;height:18px;stroke:#fff;}
  .brand-text{line-height:1.15;}
  .brand-text .t1{font-weight:700;font-size:13.5px;letter-spacing:.1px;}
  .brand-text .t2{font-size:11px;color:var(--text-faint);}

  .nav{
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    gap:2px;
    overflow-y:auto;
    flex:1;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 12px;
    border-radius:9px;
    font-size:13.5px;
    font-weight:500;
    color:var(--text-muted);
    cursor:pointer;
    border:none;
    background:transparent;
    text-align:left;
    width:100%;
    position:relative;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:var(--neutral-tint);color:var(--text);}
  .nav-item.active{background:var(--primary-tint);color:var(--primary-strong);font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-check{
    margin-left:auto;
    width:15px;height:15px;
    flex-shrink:0;
  }
  .nav-check svg{width:15px;height:15px;stroke:var(--success);}

  .sidebar-foot{
    padding:16px 20px 20px;
    border-top:1px solid var(--border);
  }
  .progress-label{
    display:flex;justify-content:space-between;
    font-size:11.5px;color:var(--text-faint);margin-bottom:7px;
  }
  .progress-track{
    height:6px;border-radius:99px;background:var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--primary),#6D5AE6);
    transition:width .4s ease;
  }

  /* ---------- Mobile topbar ---------- */
  .mobile-bar{
    display:none;
    position:sticky;top:0;z-index:30;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
    align-items:center;
    gap:10px;
  }
  .icon-btn{
    background:var(--surface);border:1px solid var(--border);
    border-radius:8px;width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn svg{width:18px;height:18px;}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,15,28,.4);z-index:35;}

  /* ---------- Main ---------- */
  .main{
    margin-left:264px;
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--bg);z-index:20;
  }
  .crumb{font-size:12px;color:var(--text-faint);margin-bottom:3px;font-weight:500;}
  .page-title{font-size:20px;font-weight:700;letter-spacing:-.2px;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .theme-toggle{
    background:var(--surface);border:1px solid var(--border);border-radius:99px;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .theme-toggle svg{width:16px;height:16px;}

  .content{
    padding:34px 40px 90px;
    max-width:900px;
    width:100%;
  }
  .content-wide{max-width:1040px;}

  /* ---------- Generic building blocks ---------- */
  .eyebrow{font-size:12.5px;font-weight:600;color:var(--primary);margin-bottom:8px;}
  h1.page-h{font-size:27px;font-weight:800;letter-spacing:-.4px;margin:0 0 10px;}
  p.lede{font-size:15.5px;color:var(--text-muted);line-height:1.65;margin:0 0 26px;max-width:640px;}
  .section-title{font-size:17px;font-weight:700;margin:36px 0 14px;letter-spacing:-.1px;}
  .section-title:first-of-type{margin-top:0;}
  .body-text{font-size:14.5px;line-height:1.7;color:var(--text-muted);}
  .body-text strong{color:var(--text);}

  .card{
    background:var(--surface-3);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow-sm);
  }
  .card + .card{margin-top:14px;}

  .callout{
    border:1px solid var(--border);
    border-left:3px solid var(--primary);
    background:var(--primary-tint);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    font-size:13.5px;
    color:var(--text);
    line-height:1.6;
    margin:16px 0;
  }
  .callout.warn{border-left-color:var(--warning);background:var(--warning-tint);}
  .callout.danger{border-left-color:var(--danger);background:var(--danger-tint);}
  .callout strong{font-weight:700;}

  .mono-chip{
    display:inline-flex;align-items:center;
    font-family:var(--font-mono);font-size:12.5px;
    background:var(--neutral-tint);border:1px solid var(--border);
    padding:2px 8px;border-radius:6px;color:var(--text);
  }

  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  /* Dashboard hero */
  .hero{
    border:1px solid var(--border);
    background:linear-gradient(135deg,var(--primary-tint) 0%, var(--surface-3) 65%);
    border-radius:18px;
    padding:38px 36px;
    margin-bottom:30px;
    position:relative;
    overflow:hidden;
  }
  .hero-kicker{font-size:12.5px;font-weight:700;color:var(--primary);letter-spacing:.2px;margin-bottom:10px;}
  .hero h1{font-size:28px;font-weight:800;margin:0 0 10px;letter-spacing:-.5px;max-width:520px;}
  .hero p{font-size:14.5px;color:var(--text-muted);max-width:480px;line-height:1.65;margin:0 0 22px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--primary);color:var(--on-primary);
    border:none;border-radius:10px;
    padding:11px 20px;font-size:14px;font-weight:600;
    cursor:pointer;
  }
  .btn:hover{background:var(--primary-strong);}
  .btn svg{width:15px;height:15px;}
  .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border-strong);}
  .btn.secondary:hover{background:var(--surface);}
  .btn.ghost{background:transparent;color:var(--primary);padding:8px 4px;}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;}

  .module-card{
    background:var(--surface-3);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:border-color .15s ease;
  }
  .module-card:hover{border-color:var(--border-strong);}
  .module-icon{
    width:36px;height:36px;border-radius:9px;
    background:var(--primary-tint);
    display:flex;align-items:center;justify-content:center;
  }
  .module-icon svg{width:18px;height:18px;stroke:var(--primary-strong);}
  .module-num{font-size:11px;font-weight:600;color:var(--text-faint);}
  .module-name{font-size:14.5px;font-weight:700;}
  .module-desc{font-size:13px;color:var(--text-muted);line-height:1.5;}
  .module-status{
    margin-top:auto;padding-top:8px;
    font-size:11.5px;font-weight:600;
    display:flex;align-items:center;gap:5px;
    color:var(--text-faint);
  }
  .module-status.done{color:var(--success);}
  .module-status svg{width:13px;height:13px;}

  /* Flow diagram */
  .flow{display:flex;flex-direction:column;align-items:stretch;gap:0;max-width:420px;}
  .flow-step{
    display:flex;align-items:center;gap:12px;
    background:var(--surface-3);border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:13px 16px;
    cursor:pointer;
    font-size:13.5px;font-weight:600;
    text-align:left;
  }
  .flow-step:hover{border-color:var(--primary);}
  .flow-step.open{border-color:var(--primary);background:var(--primary-tint);}
  .flow-step .fnum{
    width:24px;height:24px;border-radius:7px;background:var(--neutral-tint);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0;
  }
  .flow-step.open .fnum{background:var(--primary);color:#fff;}
  .flow-connector{
    display:flex;justify-content:flex-start;padding-left:24px;
    color:var(--border-strong);
  }
  .flow-connector svg{width:14px;height:18px;}
  .flow-detail{
    font-size:13px;color:var(--text-muted);line-height:1.6;
    background:var(--surface);border:1px dashed var(--border-strong);
    border-radius:9px;padding:12px 14px;margin:2px 0 2px 24px;
  }

  /* horizontal simple mini flow (inline) */
  .mini-flow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0;}
  .mini-flow .node{
    font-family:var(--font-mono);font-size:12px;font-weight:500;
    background:var(--neutral-tint);border:1px solid var(--border);
    padding:6px 11px;border-radius:7px;color:var(--text);
  }
  .mini-flow .arrow{color:var(--text-faint);font-size:14px;}

  /* Concept cards */
  .concept-card{
    border:1px solid var(--border);background:var(--surface-3);
    border-radius:var(--radius);overflow:hidden;
  }
  .concept-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;cursor:pointer;
  }
  .concept-head-left{display:flex;align-items:center;gap:12px;}
  .concept-badge{
    width:38px;height:38px;border-radius:10px;background:var(--primary-tint);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .concept-badge svg{width:19px;height:19px;stroke:var(--primary-strong);}
  .concept-name{font-size:15px;font-weight:700;}
  .concept-tag{font-size:12px;color:var(--text-faint);}
  .chevron{width:16px;height:16px;color:var(--text-faint);transition:transform .15s ease;flex-shrink:0;}
  .concept-head.open .chevron{transform:rotate(180deg);}
  .concept-body{
    padding:0 20px 20px;
    display:none;
  }
  .concept-body.show{display:block;}
  .layer-label{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:none;margin:14px 0 6px;}
  .layer-label:first-child{margin-top:4px;}

  /* Tool cards */
  .tool-card{
    border:1px solid var(--border);background:var(--surface-3);
    border-radius:var(--radius);padding:20px;
  }
  .tool-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .tool-icon{width:36px;height:36px;border-radius:9px;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tool-icon svg{width:18px;height:18px;stroke:var(--primary-strong);}
  .tool-name{font-size:15px;font-weight:700;}
  .tool-row{display:flex;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--border);}
  .tool-row:first-of-type{border-top:none;padding-top:0;}
  .tool-row .k{width:82px;flex-shrink:0;color:var(--text-faint);font-weight:600;}
  .tool-row .v{color:var(--text-muted);line-height:1.5;}

  /* Stepper (Complete Test Cycle) */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:26px;}
  .tab{
    padding:10px 4px;margin-right:18px;font-size:13.5px;font-weight:600;
    color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--primary);border-color:var(--primary);}

  .stepper{display:flex;gap:24px;align-items:flex-start;}
  .stepper-rail{display:flex;flex-direction:column;gap:4px;width:190px;flex-shrink:0;}
  .rail-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    font-size:12.5px;font-weight:600;color:var(--text-faint);cursor:pointer;
  }
  .rail-item .dot{width:20px;height:20px;border-radius:99px;background:var(--neutral-tint);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
  .rail-item.active{background:var(--primary-tint);color:var(--primary-strong);}
  .rail-item.active .dot{background:var(--primary);color:#fff;}
  .rail-item.done .dot{background:var(--success);color:#fff;}
  @media (max-width:780px){.stepper{flex-direction:column;}.stepper-rail{flex-direction:row;flex-wrap:wrap;width:100%;}}

  .step-panel{flex:1;min-width:0;}
  .step-kicker{font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:6px;}
  .step-title{font-size:18px;font-weight:800;margin:0 0 10px;}
  .step-nav{display:flex;justify-content:space-between;margin-top:24px;padding-top:18px;border-top:1px solid var(--border);}

  .terminal{
    background:#0B1220;border:1px solid #1E2A44;border-radius:10px;
    padding:16px 18px;font-family:var(--font-mono);font-size:13px;color:#D6E1FF;
    margin:14px 0;line-height:1.7;
  }
  .terminal .dim{color:#7788B0;}
  .terminal .hi{color:#7DE3C0;font-weight:600;}

  .result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0;}
  @media (max-width:760px){.result-grid{grid-template-columns:repeat(2,1fr);}}
  .result-card{
    border:1.5px solid var(--border);border-radius:12px;padding:16px 14px;cursor:pointer;
    text-align:left;background:var(--surface-3);
  }
  .result-card:hover{border-color:var(--border-strong);}
  .result-card.selected{border-color:var(--primary);background:var(--primary-tint);}
  .result-card .r-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .result-card .r-icon svg{width:16px;height:16px;}
  .result-card .r-name{font-size:13.5px;font-weight:700;margin-bottom:4px;}
  .result-card .r-desc{font-size:11.5px;color:var(--text-faint);line-height:1.4;}

  table.rep-table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0;}
  table.rep-table th{
    text-align:left;font-size:11px;color:var(--text-faint);font-weight:700;
    padding:8px 12px;border-bottom:1px solid var(--border-strong);
  }
  table.rep-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-muted);}
  table.rep-table td.num{font-family:var(--font-mono);color:var(--text);}
  table.rep-table tr:last-child td{border-bottom:none;}

  .compare-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:14px 0;}
  .compare-table th{background:var(--surface);text-align:left;padding:11px 14px;font-size:12px;border:1px solid var(--border);}
  .compare-table td{padding:11px 14px;border:1px solid var(--border);color:var(--text-muted);line-height:1.5;}

  /* accordion (troubleshooting) */
  .acc{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface-3);}
  .acc + .acc{margin-top:12px;}
  .acc-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;}
  .acc-icon{width:32px;height:32px;border-radius:8px;background:var(--warning-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .acc-icon svg{width:16px;height:16px;stroke:var(--warning);}
  .acc-title{font-size:14.5px;font-weight:700;flex:1;}
  .acc-body{padding:0 18px 18px 62px;font-size:13.5px;color:var(--text-muted);line-height:1.7;display:none;}
  .acc-body.show{display:block;}

  /* app pill list */
  .app-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--surface-3);border:1px solid var(--border);
    padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;
    cursor:pointer;
  }
  .app-pill.active{border-color:var(--primary);background:var(--primary-tint);color:var(--primary-strong);}
  .app-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}

  /* quiz */
  .quiz-progress{display:flex;gap:5px;margin-bottom:22px;}
  .quiz-progress .seg{height:5px;flex:1;border-radius:99px;background:var(--border);}
  .quiz-progress .seg.done{background:var(--primary);}
  .quiz-progress .seg.current{background:var(--border-strong);}
  .q-num{font-size:12px;font-weight:700;color:var(--text-faint);margin-bottom:8px;}
  .q-text{font-size:17px;font-weight:700;margin:0 0 18px;line-height:1.4;}
  .q-option{
    display:flex;align-items:center;gap:12px;
    border:1.5px solid var(--border);border-radius:11px;padding:13px 16px;
    margin-bottom:10px;cursor:pointer;font-size:14px;font-weight:500;
  }
  .q-option:hover{border-color:var(--border-strong);}
  .q-option .letter{

  }
  .q-option.correct{border-color:var(--success);background:var(--success-tint);}
  .q-option.correct .letter{background:var(--success);color:#fff;}
  .q-option.wrong{border-color:var(--danger);background:var(--danger-tint);}
  .q-option.wrong .letter{background:var(--danger);color:#fff;}
  .q-option.disabled{cursor:default;}
  .q-explain{
    margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13.5px;line-height:1.6;
  }
  .q-explain.ok{background:var(--success-tint);color:var(--text);border:1px solid var(--success);}
  .q-explain.no{background:var(--danger-tint);color:var(--text);border:1px solid var(--danger);}

  .quiz-score{font-size:44px;font-weight:800;letter-spacing:-1px;margin-bottom:6px;}
  .quiz-score-label{font-size:14px;color:var(--text-muted);margin-bottom:26px;}

  .workflow-final{
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;
    margin:22px 0;
  }
  .workflow-final .wnode{
    font-family:var(--font-mono);font-weight:600;font-size:13px;
    background:var(--primary-tint);color:var(--primary-strong);
    padding:9px 15px;border-radius:9px;border:1px solid var(--primary);
  }
  .workflow-final .warr{color:var(--text-faint);}

  /* Quick reference */
  .ref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media (max-width:900px){.ref-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.ref-grid{grid-template-columns:1fr;}}

  .ref-term{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--primary-strong);margin-bottom:6px;}
  .ref-def{font-size:12.5px;color:var(--text-muted);line-height:1.5;}

  .footer-nav{display:flex;justify-content:space-between;margin-top:44px;padding-top:22px;border-top:1px solid var(--border);}
  .footer-nav .fbtn{display:flex;flex-direction:column;gap:2px;cursor:pointer;padding:8px 4px;}
  .footer-nav .flabel{font-size:11px;color:var(--text-faint);font-weight:600;}
  .footer-nav .fname{font-size:14px;font-weight:700;color:var(--text);}
  .footer-nav .fbtn:hover .fname{color:var(--primary);}
  .footer-nav .fbtn.right{text-align:right;align-items:flex-end;}

  .not-covered{

/* ============================================================
   THEME
   ============================================================ */
function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let next;
  if(!cur){ next = prefersDark ? 'light' : 'dark'; }
  else if(cur==='dark'){ next='light'; }
  else { next='dark'; }
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('sma_theme', next); }catch(e){}
}
(function initTheme(){
  try{
    const saved = localStorage.getItem('sma_theme');
    if(saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();

// -- Walkthrough --
function renderCycleWalkthrough(){
  const i = state.cycleStep;
  const step = CYCLE_STEPS[i];
  let extra = '';
  if(step.chip){
    extra += `<div style="margin:14px 0;"><div class="layer-label" style="margin-top:0;">${step.chipLabel}</div><span class="mono-chip">${step.chip}</span></div>`;
  }
  if(step.extra){
    extra += `<div class="callout warn">${step.extra}</div>`;
  }
  if(step.flowInline){
    extra += `<div class="mini-flow">`+step.flowInline.map((n,idx)=>`<span class="node">${n}</span>`+(idx<step.flowInline.length-1?'<span class="arrow">→</span>':'')).join('')+`</div>`;
  }
  if(step.terminal){
    extra += `<div class="terminal"><span class="dim">Brand:</span> TikTok<br><span class="dim">Channel:</span> SMS<br><span class="dim">Message:</span> <span class="hi">"Your verification code is 482913"</span></div>
    <p class="body-text">This is the actual observed result — not what the app claims happened.</p>`;
  }
  if(step.resultCards){
    extra += renderResultCardsInline('cycleResultPicked');
  }
  if(step.repTable){
    extra += `<table class="rep-table"><thead><tr><th>Brand</th><th>Operator</th><th>SMS</th><th>Call</th><th>Error</th></tr></thead>
      <tbody><tr><td>TikTok</td><td>Smart Cambodia</td><td class="num">1</td><td class="num">0</td><td></td></tr></tbody></table>
      <p class="body-text">This result is added to the running summary of every brand tested in the session.</p>`;
  }
  if(step.done){
    extra += `<div class="callout" style="text-align:center;">
      <div style="font-size:16px;font-weight:700;margin-bottom:6px;">Test Complete ✓</div>
      <p class="body-text" style="margin:0;">Move on to the next brand and repeat the cycle.</p>
    </div>`;
  }

  return `
  <div class="stepper">
    <div class="stepper-rail">
      ${CYCLE_STEPS.map((s,idx)=>`<div class="rail-item ${idx===i?'active':''} ${idx<i?'done':''}" onclick="setCycleStep(${idx})">
        <span class="dot">${idx<i?'✓':(idx+1)}</span><span>${s.title}</span>
      </div>`).join('')}
    </div>
    <div class="step-panel">
      <div class="step-kicker">STEP ${i+1} OF ${CYCLE_STEPS.length}</div>
      <div class="step-title">${step.title}</div>
      <p class="body-text">${step.body}</p>
      ${extra}

        <button class="btn secondary" ${i===0?'disabled style="opacity:.4;"':''} onclick="setCycleStep(${i-1})">← Previous step</button>
        <button class="btn" ${i===CYCLE_STEPS.length-1?'disabled style="opacity:.4;"':''} onclick="setCycleStep(${i+1})">Next step →</button>
      </div>
    </div>
  </div>`;
}
function setCycleStep(i){
  if(i<0||i>=CYCLE_STEPS.length) return;
  state.cycleStep = i;
  document.getElementById('cycleTabBody').innerHTML = renderCycleWalkthrough();

      feedback = `You observed <strong>No Result</strong>. Correct next step: do not invent a result — record it according to the testing/reporting process rather than assuming success.`;

    ${RESULT_TYPES.map(r=>`
    <div class="result-card">
      <div class="r-icon" style="background:var(--${r.color==='neutral'?'neutral-tint':r.color+'-tint'});color:var(--${r.color==='neutral'?'text-faint':r.color});">${ic(r.icon)}</div>
      <div class="r-name">${r.name}</div>
      <div class="r-desc">${r.desc}</div>
    </div>`).join('')}
  </div>

  <div class="section-title">A sample report</div>
  <p class="body-text" style="margin-bottom:14px;">Here is how observed results turn into report rows.</p>
  <table class="rep-table">
    <thead><tr><th>Brand</th><th>Operator</th><th>SMS</th><th>Call</th><th>Error</th></tr></thead>
    <tbody>
      <tr><td>TikTok</td><td>Smart</td><td class="num">1</td><td class="num">0</td><td></td></tr>
      <tr><td>Amazon</td><td>Smart</td><td class="num">1</td><td class="num">0</td><td></td></tr>
      <tr><td>PayPal</td><td>Smart</td><td class="num">0</td><td class="num">1</td><td></td></tr>
      <tr><td>Example App</td><td>Smart</td><td class="num">0</td><td class="num">0</td><td>Registration error</td></tr>
    </tbody>
  </table>
  <p class="body-text">Each value comes directly from what was observed in TestTrig for that brand — a 1 in the SMS column means an SMS OTP was actually seen; a note in the Error column means the flow could not be completed normally.</p>

  <div class="callout danger"><strong>Do not invent results.</strong> Record what was actually observed.</div>

  ${footerNav()}
  `;
}

/* ============================================================
   UNCONVENTIONAL APPS
   ============================================================ */
let activeAppIdx = 0;
function renderUnconventional(){
  return `
  <div class="eyebrow">MODULE 6</div>
  <h1 class="page-h">Unconventional Apps</h1>
  <p class="lede">Not every application has the same registration flow.</p>

  <div class="app-row" id="appRow">
    ${APPS.map((a,i)=>`<div class="app-pill ${i===activeAppIdx?'active':''}" onclick="pickApp(${i})">${a.name}</div>`).join('')}
  </div>
  <div class="card" id="appDetail">${renderAppDetail()}</div>

  <div class="section-title">Why is this important?</div>
  <div class="card">
    <div class="mini-flow">
      <span class="node">Different app</span><span class="arrow">→</span>
      <span class="node">Different registration flow</span><span class="arrow">→</span>
      <span class="node">Different way to trigger phone verification</span><span class="arrow">→</span>
      <span class="node">Same testing objective</span>
    </div>
  </div>

  ${footerNav()}
  `;
}
function renderAppDetail(){
  const a = APPS[activeAppIdx];
  return `<div class="concept-name" style="margin-bottom:8px;">${a.name}</div>
    <p class="body-text">${a.note}</p>
    <div class="not-covered">Specific step-by-step flow: not covered in the provided guide.</div>`;
}
function pickApp(i){
  activeAppIdx = i;
  document.getElementById('appRow').innerHTML = APPS.map((a,idx)=>`<div class="app-pill ${idx===activeAppIdx?'active':''}" onclick="pickApp(${idx})">${a.name}</div>`).join('');
  document.getElementById('appDetail').innerHTML = renderAppDetail();
}

/* ============================================================
   TROUBLESHOOTING
   ============================================================ */
let openAcc = null;
function renderTroubleshooting(){
  return `
  <div class="eyebrow">MODULE 7</div>
  <h1 class="page-h">Troubleshooting</h1>
  <p class="lede">Common situations that interrupt a normal test cycle, and how to think about each one.</p>

  <div id="accList">${TROUBLESHOOTING.map((t,i)=>renderAcc(t,i)).join('')}</div>

  <div class="section-title">Browser vs Mobile Device</div>
  <table class="compare-table">
    <thead><tr><th>Browser</th><th>Android / Apple</th></tr></thead>
    <tbody>
      <tr><td>Faster where supported</td><td>Needed when web version is unavailable</td></tr>
      <tr><td>Easier for quick operations</td><td>Tests actual mobile app behavior</td></tr>
      <tr><td>Not available for every brand</td><td>Can test device-specific flows</td></tr>
    </tbody>
  </table>
  <p class="body-text">The source guide recommends browser testing where possible, for faster operations, while some brands require mobile devices.</p>

  ${footerNav()}
  `;
}
function renderAcc(t,i){
  const open = openAcc===i;
  let body = t.body;
  if(t.flow){
    body += `<div class="mini-flow">`+t.flow.map((n,idx)=>`<span class="node">${n}</span>`+(idx<t.flow.length-1?'<span class="arrow">→</span>':'')).join('')+`</div>`;
  }
  return `<div class="acc">
    <div class="acc-head" onclick="toggleAcc(${i})">
      <div class="acc-icon">${ic(t.icon)}</div>
      <div class="acc-title">${t.title}</div>
      <div class="chevron ${open?'':''}" style="transform:rotate(${open?180:0}deg)">${chevronSvg()}</div>
    </div>
    <div class="acc-body ${open?'show':''}">${body}</div>
  </div>`;
}
function toggleAcc(i){
  openAcc = openAcc===i?null:i;
  document.getElementById('accList').innerHTML = TROUBLESHOOTING.map((t,idx)=>renderAcc(t,idx)).join('');
}

/* ============================================================
   QUICK REFERENCE
   ============================================================ */
function renderReference(){
  return `
  <div class="eyebrow">CHEAT SHEET</div>
  <h1 class="page-h">Quick Reference</h1>
  <p class="lede">Every core term in one place, for when you just need a fast reminder.</p>

  <div class="ref-grid">
    ${REFERENCE.map(r=>`<div class="ref-card"><div class="ref-term">${r.term}</div><div class="ref-def">${r.def}</div></div>`).join('')}
  </div>

  <div class="section-title">The mental model</div>
  <div class="workflow-final">
    ${['TRIGGER','RECORD','OBSERVE','VERIFY','REPORT'].map((w,i,arr)=>`<span class="wnode">${w}</span>`+(i<arr.length-1?'<span class="warr">→</span>':'')).join('')}
  </div>

  ${footerNav()}
  `;
}

/* ============================================================
   QUIZ
   ============================================================ */
function renderQuiz(){
  const q = state.quiz;
  if(q.done){
    return `
    <div class="eyebrow">MODULE 8</div>
    <h1 class="page-h">Knowledge Check</h1>
    <div class="quiz-result">
      <div class="quiz-score">${q.correctCount} / ${QUIZ.length}</div>
      <div class="quiz-score-label">${q.correctCount===QUIZ.length ? 'Perfect score — you understand the full workflow.' : 'Nice work. Review any missed topics and try again anytime.'}</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" onclick="restartQuiz()">Retake the quiz</button>
        <button class="btn secondary" onclick="goTo('reference')">Review Quick Reference</button>
      </div>
    </div>

    <div class="section-title">The Sentinel testing workflow</div>
    <div class="card">
      <ol class="body-text" style="padding-left:18px;line-height:2;">
        <li>Choose the brand</li><li>Choose the operator</li><li>Use the test MSISDN</li>
        <li>Open the registration flow</li><li>Trigger phone verification</li><li>Record the test</li>
        <li>Check TestTrig</li><li>Interpret the result</li><li>Review data in Redash when necessary</li>
        <li>Update the testing report</li><li>Move to the next brand</li>
      </ol>
    </div>
    <div class="workflow-final">
      ${['TRIGGER','RECORD','OBSERVE','VERIFY','REPORT'].map((w,i,arr)=>`<span class="wnode">${w}</span>`+(i<arr.length-1?'<span class="warr">→</span>':'')).join('')}
    </div>
    ${footerNav()}
    `;
  }

  const i = q.idx;
  const item = QUIZ[i];
  const answered = q.answered!==null;
  return `
  <div class="eyebrow">MODULE 8</div>
  <h1 class="page-h">Knowledge Check</h1>
  <div class="quiz-progress">
    ${QUIZ.map((_,idx)=>`<div class="seg ${idx<i?'done':idx===i?'current':''}"></div>`).join('')}
  </div>
  <div class="q-num">QUESTION ${i+1} OF ${QUIZ.length}</div>
  <div class="q-text">${item.q}</div>
  <div id="quizOpts">
    ${item.opts.map((o,idx)=>renderQOption(item,idx,q.answered)).join('')}
  </div>
  ${answered ? `<div class="q-explain ${q.answered===item.a?'ok':'no'}">
      <strong>${q.answered===item.a? 'Correct.' : 'Not quite.'}</strong> ${item.explain}
    </div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn" onclick="nextQuizQ()">${i===QUIZ.length-1?'See your score':'Next question →'}</button>
    </div>` : ''}
  `;
}
function renderQOption(item,idx,answered){
  const letters = ['A','B','C','D'];
  let cls = '';
  if(answered!==null){
    cls = 'disabled';
    if(idx===item.a) cls += ' correct';
    else if(idx===answered) cls += ' wrong';
  }
  return `<div class="q-option ${cls}" onclick="${answered===null?`answerQuiz(${idx})`:''}">
    <span class="letter">${letters[idx]}</span><span>${item.opts[idx]}</span>
  </div>`;
}
function answerQuiz(idx){
  const q = state.quiz;
  if(q.answered!==null) return;
  q.answered = idx;
  if(idx===QUIZ[q.idx].a) q.correctCount++;
  document.getElementById('content').innerHTML = renderQuiz();
}
function nextQuizQ(){
  const q = state.quiz;
  if(q.idx===QUIZ.length-1){
    q.done = true;
    saveQuizBest(q.correctCount, QUIZ.length);
    markVisited('quiz');
  } else {
    q.idx++;
    q.answered = null;
  }
  document.getElementById('content').innerHTML = renderQuiz();
}
function restartQuiz(){
  state.quiz = {idx:0, answered:null, correctCount:0, done:false};
  document.getElementById('content').innerHTML = renderQuiz();
}

/* ============================================================
   INIT
   ============================================================ */
markVisited('dashboard');
render();
</script>
